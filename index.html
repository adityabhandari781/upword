<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Guess the hidden word from its pixel rows.">
    <title>Height Wordle</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2312202d'/%3E%3Cpath fill='%23f5b642' d='M12 10h10v17h20V10h10v44H42V37H22v17H12z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <p class="eyebrow">A visual word puzzle</p>
        <h1>Height Wordle</h1>
        <p class="intro">Read the pixels from the bottom up. Guess the word before its shape gives it away.</p>
      </header>

      <section class="game-card" aria-labelledby="puzzle-heading">
        <button id="settings-button" class="settings-button" type="button" aria-label="Open game settings" aria-haspopup="dialog" aria-controls="settings-dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9.7 2-.4 2.1a8 8 0 0 0-1.8 1L5.6 4 4 5.6l1.1 1.9a8 8 0 0 0-1 1.8L2 9.7v2.6l2.1.4a8 8 0 0 0 1 1.8L4 16.4 5.6 18l1.9-1.1a8 8 0 0 0 1.8 1l.4 2.1h2.6l.4-2.1a8 8 0 0 0 1.8-1l1.9 1.1 1.6-1.6-1.1-1.9a8 8 0 0 0 1-1.8l2.1-.4V9.7l-2.1-.4a8 8 0 0 0-1-1.8L20 5.6 18.4 4l-1.9 1.1a8 8 0 0 0-1.8-1L14.3 2zM12 8a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/>
          </svg>
        </button>
        <div class="card-heading">
          <div>
            <p class="eyebrow">Puzzle</p>
            <h2 id="puzzle-heading">What word is hiding?</h2>
          </div>
          <p id="attempts" class="attempts">Wrong guesses: 0 / 3</p>
        </div>

        <div class="canvas-frame">
          <canvas id="word-canvas" role="img" aria-label="Partially revealed pixel word"></canvas>
        </div>

        <p id="status" class="status" aria-live="polite">The bottom row is your first clue.</p>

        <form id="guess-form" class="guess-form" novalidate>
          <label for="guess">Your guess</label>
          <div class="guess-controls">
            <input id="guess" name="guess" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <button type="submit">Reveal row</button>
          </div>
        </form>

        <button id="new-round" class="new-round" type="button" hidden>New puzzle</button>
      </section>
    </main>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-heading">
      <form id="settings-form" method="dialog">
        <h2 id="settings-heading">Game settings</h2>
        <p class="settings-note">Changes apply to your next puzzle.</p>

        <fieldset>
          <legend>Reveal direction</legend>
          <label><input type="radio" name="reveal-direction" value="bottom-up" checked> Bottom up</label>
          <label><input type="radio" name="reveal-direction" value="top-down"> Top down</label>
          <label><input type="radio" name="reveal-direction" value="ends-to-center"> Ends to center</label>
        </fieldset>

        <fieldset>
          <legend>Letter style</legend>
          <label><input type="radio" name="letter-case" value="uppercase" checked> CAPITAL LETTERS</label>
          <label><input type="radio" name="letter-case" value="lowercase"> lowercase letters</label>
          <label><input type="radio" name="letter-case" value="mixed"> Mixed case</label>
        </fieldset>

        <div class="settings-actions">
          <button id="settings-cancel" type="button" class="settings-cancel">Cancel</button>
          <button type="submit">Apply settings</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
